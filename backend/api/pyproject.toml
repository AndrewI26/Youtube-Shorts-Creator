[project]
name = "shorts-backend"
version = "0.2.0"
description = "FastAPI backend that turns Reddit posts into narrated, captioned YouTube Shorts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.9",
    # Video pipeline
    "gtts>=2.5",
    "ffmpeg-python==0.2.0",
    "faster-whisper>=1.1",
    # faster-whisper passes a kwarg PyAV 18+ removed
    "av<18",
    "moviepy>=1.0.3,<2",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]
